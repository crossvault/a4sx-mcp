#
# One-off, manual: prints the Visual Studio Marketplace profile id of the Entra app that will publish the
# VS Code extension, so the owner can add that id as a Contributor member of the Marketplace publisher.
# It signs in with workload identity federation (OIDC); no secret is stored anywhere. The id it prints is
# an identifier, not a credential. Runs only in the `visual-studio-marketplace` environment, which needs
# the owner's approval. Every action is pinned to a full commit SHA.
name: Marketplace whoami

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: visual-studio-marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace profile id
        run: |
          az rest -u "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "{id: id, displayName: displayName}" -o json
