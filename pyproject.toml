[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "a4sx-mcp"
version = "0.1.0rc1"
description = "Local MCP server (stdio) for a4sx: search, load and save coding-agent sessions from any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "crossVault GmbH" }]
keywords = ["mcp", "model-context-protocol", "claude-code", "claude", "cursor", "session", "transcript", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Typing :: Typed",
]
# `a4sx` (the session SDK) is published to PyPI before this package.
dependencies = [
    "a4sx>=0.11.0,<0.12",
    "mcp>=2.3,<3",
    "jsonschema>=4.20",
    "anyio>=4.9",
]

[project.scripts]
a4sx-mcp = "a4sx_mcp.__main__:main"

[project.urls]
Homepage = "https://session-exchange.com"
Source = "https://github.com/crossvault/a4sx-mcp"
Issues = "https://github.com/crossvault/a4sx-mcp/issues"
Changelog = "https://github.com/crossvault/a4sx-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5", "reuse[charset-normalizer]>=4", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/a4sx_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSES", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md", "REUSE.toml"]
# The VS Code extension is not part of the Python package (the patterns above would also match vscode/src etc.).
exclude = ["/vscode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["a4sx_mcp"]
known-third-party = ["a4sx", "mcp", "mcp_types"]
known-local-folder = ["conftest", "stub_server"]
