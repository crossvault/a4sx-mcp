version = 1

[[annotations]]
path = ["CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "README.md", "NOTICE", "LICENSE", ".gitignore", ".gitattributes", ".github/**", "src/a4sx_mcp/py.typed", "server.json", "glama.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 crossVault GmbH"
SPDX-License-Identifier = "Apache-2.0"

# The VS Code extension (vscode/): files that can't carry a comment header. Its .ts/.mjs sources have one.
[[annotations]]
path = ["vscode/README.md", "vscode/CHANGELOG.md", "vscode/LICENSE", "vscode/package.json", "vscode/package-lock.json", "vscode/tsconfig.json", "vscode/media/icon.png", "vscode/images/icon.png", "vscode/.gitignore", "vscode/.vscodeignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 crossVault GmbH"
SPDX-License-Identifier = "Apache-2.0"

# The herdr plugin's deck (crossvault/a4sx-herdr-plugin, MIT), bundled unchanged in the extension: no header is added
# to it, because its sha256 is pinned.
[[annotations]]
path = ["vscode/deck/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 crossVault GmbH"
SPDX-License-Identifier = "MIT"
